id: com.genymobile.scrcpy

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .

command: scrcpy.sh

rename-desktop-file: scrcpy.desktop
rename-icon: scrcpy

finish-args:
  - --device=all
  - --env=SCRCPY_ICON_PATH=/app/share/icons/hicolor/256x256/apps/com.genymobile.scrcpy.png
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --persist=.android

modules:
  - name: googletest
    buildsystem: cmake
    config-opts:
      - -DBUILD_GMOCK=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: 
          https://github.com/google/googletest/releases/download/v1.18.0/googletest-1.18.0.tar.gz
        sha256: 6e3191c1455468b3fc35a417fb565c1c5071aee1b7e7f85e30cf48a98d37d8b5
        x-checker-data:
          type: anitya
          project-id: 18290
          url-template: 
            https://github.com/google/googletest/releases/download/v$version/googletest-$version.tar.gz
  - name: protobuf
    buildsystem: cmake
    cleanup:
      - '*'
    sources:
      - type: archive
        url: 
          https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protobuf-35.1.tar.gz
        sha256: f0b6838e7522a8da96126d487068c959bc624926368f3024ac8fd03abd0a1ac4
        x-checker-data:
          type: anitya
          project-id: 3715
          url-template: 
            https://github.com/protocolbuffers/protobuf/releases/download/v$version/protobuf-$version.tar.gz
  - name: android-tools
    buildsystem: cmake
    builddir: true
    cleanup:
      - /lib/debug/bin
      - /share/android-tools
      - /share/bash-completion
      - /share/man
    sources:
      - type: archive
        url: 
          https://github.com/nmeum/android-tools/releases/download/37.0.0/android-tools-37.0.0.tar.xz
        sha256: 2725d09f892a3a38e534429f47a321f58ecf6a3169caa42c915fb2cb7d46be0e
        x-checker-data:
          type: anitya
          project-id: 226905
          url-template: 
            https://github.com/nmeum/android-tools/releases/download/$version/android-tools-$version.tar.xz
      - type: patch
        path: patches/android-tools/0001-adb-only.patch
  - name: scrcpy
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Db_lto=true
      - -Dprebuilt_server=scrcpy-server
      - --strip
    cleanup:
      - /share/applications/scrcpy-console.desktop
      - /share/bash-completion
      - /share/man
      - /share/zsh
    sources:
      - type: archive
        url: https://github.com/Genymobile/scrcpy/archive/refs/tags/v5.0.tar.gz
        sha256: a431f6ed9e63629938464bbfe92b022d6dddf09d7e1d52758b3fc5b52d4c4b03
        x-checker-data:
          type: anitya
          project-id: 226924
          url-template: 
            https://github.com/Genymobile/scrcpy/archive/refs/tags/v$version.tar.gz
      - type: file
        url: 
          https://github.com/Genymobile/scrcpy/releases/download/v5.0/scrcpy-server-v5.0
        sha256: 26cbc9ad0aced6c2282455bef4fb43462605c1f8758c74b4ab1dbf818c229daa
        dest-filename: scrcpy-server
        x-checker-data:
          type: anitya
          project-id: 226924
          url-template: 
            https://github.com/Genymobile/scrcpy/releases/download/v$version/scrcpy-server-v$version
  - name: scrcpy-wrapper
    buildsystem: simple
    build-commands:
      - install -D scrcpy.sh /app/bin/scrcpy.sh
    sources:
      - type: file
        path: scrcpy.sh
  - name: scrcpy-metadata
    buildsystem: simple
    build-commands:
      - install -D com.genymobile.scrcpy.metainfo.xml 
        /app/share/metainfo/com.genymobile.scrcpy.metainfo.xml
    sources:
      - type: file
        path: com.genymobile.scrcpy.metainfo.xml
