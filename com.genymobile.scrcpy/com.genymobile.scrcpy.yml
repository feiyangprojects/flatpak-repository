id: com.genymobile.scrcpy

runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .

command: scrcpy.sh

rename-desktop-file: scrcpy.desktop
rename-icon: scrcpy

finish-args:
  - --device=all
  - --env=SCRCPY_ICON_PATH=/app/share/icons/hicolor/256x256/apps/com.genymobile.scrcpy.png
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --persist=.android

modules:
  - name: googletest
    buildsystem: cmake
    config-opts:
      - -DBUILD_GMOCK=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: 
          https://github.com/google/googletest/releases/download/v1.18.0/googletest-1.18.0.tar.gz
        sha256: 6e3191c1455468b3fc35a417fb565c1c5071aee1b7e7f85e30cf48a98d37d8b5
        x-checker-data:
          type: anitya
          project-id: 18290
          url-template: 
            https://github.com/google/googletest/releases/download/v$version/googletest-$version.tar.gz
  - name: protobuf
    buildsystem: cmake
    cleanup:
      - '*'
    sources:
      - type: archive
        url: 
          https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protobuf-36.2.tar.gz
        sha256: 3d9642a662d10e68ebae5e53f14dcce5105684212d5078f8e0d47d1ab3ae6b64
        x-checker-data:
          type: anitya
          project-id: 3715
          url-template: 
            https://github.com/protocolbuffers/protobuf/releases/download/v$version/protobuf-$version.tar.gz
  - name: android-tools
    buildsystem: cmake
    builddir: true
    cleanup:
      - /lib/debug/bin
      - /share/android-tools
      - /share/bash-completion
      - /share/man
    sources:
      - type: archive
        url: 
          https://github.com/nmeum/android-tools/releases/download/37.0.0p1/android-tools-37.0.0p1.tar.xz
        sha256: 2c6de1abe16b211c7d9f59276217e14fd9e0e18b20e331d3c84358f5dffd576e
        x-checker-data:
          type: anitya
          project-id: 226905
          url-template: 
            https://github.com/nmeum/android-tools/releases/download/$version/android-tools-$version.tar.xz
      - type: patch
        path: patches/android-tools/0001-adb-only.patch
  - name: scrcpy
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Db_lto=true
      - -Dprebuilt_server=scrcpy-server
      - --strip
    cleanup:
      - /share/applications/scrcpy-console.desktop
      - /share/bash-completion
      - /share/man
      - /share/zsh
    sources:
      - type: archive
        url: 
          https://github.com/Genymobile/scrcpy/archive/refs/tags/v5.0.1.tar.gz
        sha256: a24b996ac23d0f674d3237c00b39a97829d8acbe9e1657a6c216fd51ea488ee5
        x-checker-data:
          type: anitya
          project-id: 226924
          url-template: 
            https://github.com/Genymobile/scrcpy/archive/refs/tags/v$version.tar.gz
      - type: file
        url: 
          https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-server-v5.0.1
        sha256: 764eb6f79811d5211fe9df341120882ba9994c7a61b897d7bf3fb662e53bc536
        dest-filename: scrcpy-server
        x-checker-data:
          type: anitya
          project-id: 226924
          url-template: 
            https://github.com/Genymobile/scrcpy/releases/download/v$version/scrcpy-server-v$version
  - name: scrcpy-wrapper
    buildsystem: simple
    build-commands:
      - install -D scrcpy.sh /app/bin/scrcpy.sh
    sources:
      - type: file
        path: scrcpy.sh
  - name: scrcpy-metadata
    buildsystem: simple
    build-commands:
      - install -D com.genymobile.scrcpy.metainfo.xml 
        /app/share/metainfo/com.genymobile.scrcpy.metainfo.xml
    sources:
      - type: file
        path: com.genymobile.scrcpy.metainfo.xml
