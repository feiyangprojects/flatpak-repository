app-id: io.github.bggRGjQaUbCoE.PiliPlus
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: piliplus
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --own-name=com.example.piliplus
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher
cleanup:
  - /lib/debug
modules:
  - ../shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: shaderc
    buildsystem: cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSHADERC_SKIP_TESTS=ON
      - -DSHADERC_SKIP_EXAMPLES=ON
      - -DSHADERC_SKIP_EXECUTABLES=ON
    cleanup:
      - /bin
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/cmake
      - /lib/pkgconfig
    sources:
      - type: archive
        url: https://github.com/google/shaderc/archive/refs/tags/v2026.4.tar.gz
        sha256: f06ce5bcca94e5df7f34e115743597d0ad2e13c5fe9213c67dc8c76031241947
        x-checker-data:
          type: anitya
          project-id: 19047
          url-template: 
            https://github.com/google/shaderc/archive/refs/tags/v$version.tar.gz
      - type: archive
        url: 
          https://github.com/KhronosGroup/glslang/archive/refs/tags/16.6.0.tar.gz
        sha256: 9c09b901149c729df745057dafa815278aaa101b84d2b6e14f16a42de52f97f2
        dest: third_party/glslang
        x-checker-data:
          type: anitya
          project-id: 205796
          url-template: 
            https://github.com/KhronosGroup/glslang/archive/refs/tags/$version.tar.gz
      - type: archive
        url: 
          https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.357.0.tar.gz
        sha256: 4d703067a7e06331ccb37bdfed3f9b7879cc61969a2689ae95c95db34a47ff07
        dest: third_party/spirv-headers
        x-checker-data:
          type: anitya
          project-id: 334920
          url-template: 
            https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-$version.tar.gz
      - type: archive
        url: 
          https://github.com/KhronosGroup/SPIRV-Tools/archive/refs/tags/v2026.3.tar.gz
        sha256: fff0667b25dfb98177da3cc4cc61ac277d076786df42baaf8d9635a25bdf9226
        dest: third_party/spirv-tools
        x-checker-data:
          type: anitya
          project-id: 14894
          url-template: 
            https://github.com/KhronosGroup/SPIRV-Tools/archive/refs/tags/v$version.tar.gz
  - name: hwdata
    buildsystem: autotools
    cleanup:
      - /share/pkgconfig
    sources:
      - type: archive
        url: https://github.com/vcrhonek/hwdata/archive/refs/tags/v0.411.tar.gz
        sha256: d75462181fbd307228e0a48b8d1449f1773ea4b1f17e8a1d56346907f999ce33
        x-checker-data:
          type: anitya
          project-id: 5387
          url-template: 
            https://github.com/vcrhonek/hwdata/archive/refs/tags/v$version.tar.gz
  - name: libass
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: 
          https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
        x-checker-data:
          type: anitya
          project-id: 1560
          url-template: 
            https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz
  - name: libdisplay-info
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        url: 
          https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.4.0/libdisplay-info-0.4.0.tar.gz
        sha256: 787b58aec473830b0030251ba2b880560b4b3853dc5d6961a6e9701abae29b55
        x-checker-data:
          type: anitya
          project-id: 326668
          url-template: 
            https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/$version/libdisplay-info-$version.tar.gz
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=False
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
        x-checker-data:
          type: json
          url: https://api.github.com/repos/haasn/libplacebo/releases/latest
          tag-query: .tag_name
  - name: libXpresent
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: 
          https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.2.tar.xz
        sha256: 4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602
        x-checker-data:
          type: anitya
          project-id: 17166
          url-template: 
            https://xorg.freedesktop.org/archive/individual/lib/libXpresent-$version.tar.xz
  - name: libmpv
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/bash-completion
      - /share/zsh
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dbuild-date=false
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
        x-checker-data:
          type: anitya
          project-id: 5348
          url-template: 
            https://github.com/mpv-player/mpv/archive/v$version.tar.gz
  - name: piliplus
    buildsystem: simple
    build-commands:
      - install -Dm644 data/flutter_assets/assets/images/logo/logo.png 
        /app/share/icons/hicolor/512x512/apps/$FLATPAK_ID.png
      - cp -r . /app/share/piliplus
      - mkdir -p /app/bin
      - ln -s /app/share/piliplus/piliplus /app/bin/piliplus
      - install -Dm644 io.github.bggRGjQaUbCoE.PiliPlus.desktop -t 
        /app/share/applications/
      - install -Dm644 io.github.bggRGjQaUbCoE.PiliPlus.metainfo.xml -t 
        /app/share/metainfo/
    sources:
      #- type: archive
      #  only-arches:
      #    - aarch64
      #  url: https://github.com/bggRGjQaUbCoE/PiliPlus/releases/download/1.1.4.15/PiliPlus_linux_1.1.4%2B4285_arm64.tar.gz
      #  sha256: 7f9c266ca7d0a0d41d113c229f21e5fa12c2ba38031bf4d714b5ae853befb961
      #  x-checker-data:
      #    type: json
      #    url: https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases/latest
      #    version-query: .tag_name
      #    url-query: .assets[] | select(.name | test("PiliPlus_linux_.+_arm64\\.tar\\.gz"))
      #      | .browser_download_url
      - type: archive
        only-arches:
          - x86_64
        url: 
          https://github.com/bggRGjQaUbCoE/PiliPlus/releases/download/2.1.5/PiliPlus_linux_2.1.5%2B5410_amd64.tar.gz
        sha256: b50a6003cc979a69ff9b9792009665ec8a3e4c6ee9842be046980fa0da14735b
        x-checker-data:
          type: json
          url: 
            https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name | 
            test("PiliPlus_linux_.+_amd64\\.tar\\.gz")) | .browser_download_url
      - type: file
        path: io.github.bggRGjQaUbCoE.PiliPlus.desktop
      - type: file
        path: io.github.bggRGjQaUbCoE.PiliPlus.metainfo.xml
